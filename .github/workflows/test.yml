# The build and test gate for the whole module. Restored from 32ce4c9, which merge
# 35ceb0f0 ("reliability checkpoint: merge beta/custom-server") dropped by resolving
# to the parent that had no .github at all — so this repo, main included, ran no CI
# between 2026-08-04 and today.
#
# The branch list is the one change from the restored file, and it is the defect that
# made the loss easy to miss: the original triggered on beta/custom-server alone, so
# it never gated main even while it existed. beta/** covers both beta lines.
name: Test — connect

on:
  push:
    branches:
      - main
      - 'beta/**'
  pull_request:
    branches:
      - main
      - 'beta/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Check out connect
        uses: actions/checkout@v4

      # go.mod resolves this with `replace github.com/urnetwork/glog => ../glog`,
      # so it has to sit beside the checkout
      - name: Check out glog dependency
        run: git clone --depth 1 https://github.com/urnetwork/glog.git ../glog

      # read from go.mod rather than `stable`, so the gate is built with the
      # toolchain the module declares and a future Go release cannot quietly change
      # what a green run means. go.mod pins `toolchain go1.26.5`.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # -count=1 defeats the test result cache so a green run always means the
      # tests actually ran. the root package (the data path) takes ~9 min.
      #
      # extender used to be excluded here and run in a `continue-on-error` step
      # instead, because TestExtender slept a fixed 1s for its two listeners to
      # bind and failed with EOF when a loaded runner needed longer. The test now
      # polls both listeners until they accept, so extender gates like everything
      # else. A step that cannot fail the job is a note, not a gate.
      #
      # TestPump, TestPumpTrim and TestCombineTrim used to fail on a Windows dev
      # box and only there. time.Now() advances every ~500us on Windows, so a
      # burst of queue adds shares a single timestamp, and two strict
      # comparisons on updateTime silently assumed that never happens: the heap
      # ordering left ties unordered, and RemoveOlder never evicted an item
      # stamped inside the cutoff's own tick. Linux clocks are nanosecond
      # grained, which is why CI never saw either. Both are fixed in
      # transport_pt_queue.go, so this suite is expected green on Windows too.
      - name: Test
        run: go test -count=1 -timeout 20m ./...
