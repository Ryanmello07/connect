# Restored from 32ce4c9 and retargeted to beta/message. Merge 35ceb0f0 dropped this
# alongside test.yml by resolving to the parent that had no .github directory.
#
# Three things changed from the restored file, all deliberate:
#
#  1. The connect side points at beta/message. The sn side does NOT: sn has no
#     beta/message branch, so the miner still builds from sn's own beta/custom-server
#     line, against this branch's connect. That is the coherent reading of "retarget
#     to beta/message" — it exercises the miner with this connect, rather than
#     inventing a branch that does not exist.
#
#  2. The rolling tag is beta-message-latest, NOT beta-custom-server-latest. Leaving
#     the old name would make this workflow force-push over the existing provider beta
#     release the moment it first ran, which is destructive and silent.
#
#  3. The path filter is unchanged and is load-bearing: this fires only when go.mod or
#     go.sum change on a push. p1 touched neither, so restoring this publishes nothing
#     today — but any later plan that adds a dependency WILL cut a release. That is the
#     accepted cost of having it live on the working branch.
name: Provider Beta Release

on:
  push:
    branches:
      - beta/message
    paths:
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.version.outputs.short_sha }}

    steps:
      - name: Check out sn
        uses: actions/checkout@v4
        with:
          repository: Ryanmello07/sn
          ref: beta/custom-server
          path: sn

      - name: Check out connect
        uses: actions/checkout@v4
        with:
          repository: Ryanmello07/connect
          ref: beta/message
          path: connect

      - name: Check out glog
        uses: actions/checkout@v4
        with:
          repository: urnetwork/glog
          path: glog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'sn/go.mod'

      - name: Set version
        id: version
        working-directory: sn
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build miner
        working-directory: sn/miner
        run: make all
        env:
          WARP_VERSION: beta-message-${{ steps.version.outputs.short_sha }}

      - name: Upload miner artifact
        uses: actions/upload-artifact@v4
        with:
          name: miner.tar.gz
          path: sn/miner/build/miner.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download miner artifact
        uses: actions/download-artifact@v4
        with:
          name: miner.tar.gz

      - name: Update rolling tag
        run: |
          git tag -f beta-message-latest
          git push -f origin beta-message-latest

      - name: Create or update beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-message-latest
          name: beta-message-latest
          body: |
            Rolling beta release for the `beta/message` branch, built from
            `Ryanmello07/sn` (miner) at commit ${{ needs.build.outputs.short_sha }}.

            - connect commit: ${{ github.sha }}
            - Timestamp: ${{ github.event.head_commit.timestamp }}
          prerelease: true
          files: miner.tar.gz
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
